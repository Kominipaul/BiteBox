{{ range .Products }}
<div class="card flex-between" id="product-{{ .ID }}">
  <form hx-post="/admin/products/{{ .ID }}" hx-target="#product-list" class="row edit-form">
    <input type="text" name="name" value="{{ .Name }}" required style="margin:0; flex:1; min-width:100px;">
    <input type="number" name="price" value="{{ printf "%.2f" .Price }}" step="0.10" min="0" required style="margin:0; width:6rem;">
    <input type="number" name="stock" value="{{ .Stock }}" min="-1" style="margin:0; width:6rem;" title="-1 = unlimited">
    <button type="submit" style="border-radius: 8px;">Save</button>
  </form>
  <div class="row">
    {{ if eq .Stock -1 }}
      <span class="badge" style="background:#0d6efd;">Unlimited</span>
    {{ else if eq .Stock 0 }}
      <span class="badge" style="background:#dc3545;">Out of stock</span>
    {{ else }}
      <span class="badge" style="background:#0d6efd;">{{ .Stock }} in stock</span>
    {{ end }}
    {{ if .IsAvailable }}
      <span class="badge" style="background:#28a745;">Available</span>
    {{ else }}
      <span class="badge" style="background:#6c757d;">Hidden</span>
    {{ end }}
    <button hx-post="/admin/products/{{ .ID }}/toggle" hx-target="#product-list" style="border-radius: 8px;">
      {{ if .IsAvailable }}Hide{{ else }}Show{{ end }}
    </button>
  </div>
</div>
{{ else }}
<p>No products yet.</p>
{{ end }}
