{{ range .Entries }}
<div class="history-card">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <strong>Table {{ .TableNumber }} → acknowledged by {{ .AcknowledgedBy }}</strong>
    <span class="history-time">{{ .AcknowledgedAt.Local.Format "2006-01-02 15:04" }}</span>
  </div>
  <p class="empty-note" style="margin-top:4px;">Waited {{ .WaitLabel }}</p>
</div>
{{ else }}
<p class="empty-note">No call-waiter requests acknowledged yet.</p>
{{ end }}
