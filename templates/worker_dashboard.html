<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiteBox Worker — {{ .Username }}</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#D9A441">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png?v={{ .IconVersion }}">
<!-- iOS ignores the manifest's own display:standalone unless these legacy
     tags are also present — both are load-bearing for "Add to Home Screen"
     actually opening in standalone mode, which push notifications require
     on iOS (16.4+) before Safari will subscribe at all. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BiteBox">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/static/vendor/htmx.min.js"></script>
<script src="/static/vendor/htmx-ws.js"></script>
<style>
  :root{
    --bg-base:#14100D; --bg-surface:#1D1712; --bg-raised:#261F18;
    --border:#332920; --border-soft:#2A2119;
    --text-primary:#F5EFE6; --text-secondary:#AB9C89; --text-muted:#75695C;
    --accent:#D9A441; --accent-strong:#E8B85B; --accent-soft:rgba(217,164,65,.13);
    --success:#5FA777; --success-soft:rgba(95,167,119,.14);
    --danger:#C25B48; --danger-soft:rgba(194,91,72,.15);
    --purple:#9B6FAE; --purple-soft:rgba(155,111,174,.16);
    --info:#6B8CAE; --info-soft:rgba(107,140,174,.15);
    --radius-lg:16px; --radius-md:12px; --radius-sm:9px;
    --font-display:'IBM Plex Mono',ui-monospace,monospace;
    --font-body:'Manrope',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-base);color:var(--text-primary);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;min-height:100vh;}
  button{font-family:inherit;}
  h1,h2{margin:0;}
  :focus-visible{outline:3px solid var(--accent-strong);outline-offset:2px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;
    border-bottom:1px solid var(--border-soft);position:sticky;top:0;
    background:rgba(20,16,13,.92);backdrop-filter:blur(8px);z-index:20;}
  .brand{display:flex;align-items:center;gap:13px;}
  .brand-mark{width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(155deg,var(--bg-raised),var(--bg-surface));border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .brand-eyebrow{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-muted);font-weight:700;}
  .worker-name{font-size:19px;font-weight:800;}
  .live-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--success);
    background:var(--success-soft);border:1px solid rgba(95,167,119,.25);padding:6px 12px 6px 10px;
    border-radius:99px;margin-right:12px;}
  .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse 2.2s ease-out infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,167,119,.55);}70%{box-shadow:0 0 0 7px rgba(95,167,119,0);}100%{box-shadow:0 0 0 0 rgba(95,167,119,0);}}
  @media (prefers-reduced-motion:reduce){.pulse-dot{animation:none;}}
  .topbar-right{display:flex;align-items:center;}
  .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);
    padding:10px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;cursor:pointer;}
  .btn-ghost:hover{color:var(--text-primary);border-color:var(--text-muted);}

  .dashboard{max-width:1200px;margin:0 auto;padding:26px 24px 100px;}
  .section-heading{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px;}
  .section-title{display:flex;align-items:center;gap:10px;}
  .section-title h2{font-size:17px;font-weight:800;}
  .section-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);flex:none;}
  .count-badge{background:var(--bg-raised);border:1px solid var(--border);color:var(--text-secondary);
    font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;}
  .empty-note{color:var(--text-muted);font-size:13px;padding:8px 4px;}
  .assistance-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--danger-soft);border:1px solid rgba(194,91,72,.4);color:var(--danger);
    font-weight:700;font-size:13.5px;padding:10px 14px;border-radius:var(--radius-md);margin-bottom:10px;}

  .order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}

  .order-card{background:var(--bg-surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
    padding:18px;display:flex;flex-direction:column;gap:14px;border-left:4px solid var(--border);
    transition:border-left-color .4s ease;}
  .order-top{display:flex;align-items:center;justify-content:space-between;}
  .table-tag{font-family:var(--font-display);font-size:24px;font-weight:600;}
  .order-meta{display:flex;align-items:center;gap:8px;}
  .new-flag{background:var(--danger);color:#2a0f0a;font-size:10.5px;font-weight:800;padding:3px 8px;
    border-radius:99px;letter-spacing:.03em;}
  .timer-badge{font-family:var(--font-display);font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;
    transition:background-color .4s ease,color .4s ease;}

  .order-items{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--border-soft);
    border-bottom:1px solid var(--border-soft);}
  .order-item{display:flex;gap:8px;font-size:15px;font-weight:600;}
  .order-item .qty{font-family:var(--font-display);color:var(--accent-strong);min-width:26px;}

  .pay-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .pay-badge{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:99px;white-space:nowrap;}
  .pay-cash-unpaid{background:var(--accent-soft);color:var(--accent-strong);}
  .pay-cash-paid{background:var(--success-soft);color:var(--success);}
  .mark-paid-btn{background:var(--accent);color:#221805;border:none;font-weight:800;font-size:12.5px;
    padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;}
  .mark-paid-btn:hover{filter:brightness(1.08);}

  .btn-primary-action{width:100%;padding:16px;font-size:16px;font-weight:800;border-radius:var(--radius-md);
    border:none;cursor:pointer;transition:filter .12s,transform .05s;}
  .btn-primary-action:active{transform:translateY(1px);}
  .action-preparing{background:var(--accent);color:#221805;}
  .action-preparing:hover{filter:brightness(1.08);}
  .action-ready{background:var(--purple);color:#fff;}
  .action-ready:hover{filter:brightness(1.08);}
  .action-served{background:var(--success);color:#0c1f13;}
  .action-served:hover{filter:brightness(1.08);}
  .action-done{background:var(--bg-raised);color:var(--text-muted);cursor:default;}

  .order-footer{display:flex;justify-content:flex-end;}
  .cancel-link{background:none;border:none;color:var(--text-muted);font-size:12px;font-weight:600;
    cursor:pointer;padding:4px;text-decoration:underline;text-underline-offset:2px;}
  .cancel-link:hover{color:var(--danger);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--bg-raised);border:1px solid var(--border);color:var(--text-primary);
    padding:12px 18px;border-radius:var(--radius-md);font-size:13.5px;font-weight:600;
    display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:all .2s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast-undo{background:none;border:none;color:var(--accent-strong);font-weight:800;cursor:pointer;font-size:13.5px;}

  @media (max-width:640px){ .order-grid{grid-template-columns:1fr;} .dashboard{padding:20px 14px 100px;} }

  /* ---------------------------------------------------------------
     Order alerts: a banner + chime for "new order in" (kitchen/bar) and
     "ready for pickup" (waiter), so whoever's on this screen notices
     without reading every card — see checkForNewOrderAlerts() below.
     --------------------------------------------------------------- */
  .sound-toggle{display:flex;align-items:center;justify-content:center;width:38px;height:38px;
    border-radius:var(--radius-sm);background:transparent;border:1px solid var(--border);
    color:var(--text-secondary);cursor:pointer;margin-right:10px;font-size:16px;flex:none;}
  .sound-toggle:hover{color:var(--text-primary);border-color:var(--text-muted);}
  .sound-toggle.muted{color:var(--text-muted);}
  .sound-toggle:disabled{opacity:.45;cursor:not-allowed;}

  .alert-stack{position:fixed;top:84px;right:20px;z-index:100;display:flex;flex-direction:column;
    gap:10px;width:340px;max-width:calc(100vw - 28px);pointer-events:none;}
  .alert-banner{pointer-events:auto;display:flex;align-items:flex-start;gap:12px;padding:14px 16px;
    border-radius:var(--radius-md);background:var(--bg-raised);border:1px solid var(--border);
    border-left:4px solid var(--border);box-shadow:0 12px 32px rgba(0,0,0,.45);
    opacity:0;transform:translateX(24px);transition:opacity .25s ease,transform .25s ease;}
  .alert-banner.show{opacity:1;transform:translateX(0);}
  .alert-new{border-left-color:var(--danger);}
  .alert-ready{border-left-color:var(--purple);}
  .alert-icon{font-size:20px;line-height:1;flex:none;margin-top:1px;}
  .alert-body{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .alert-body strong{font-size:13.5px;font-weight:800;}
  .alert-new .alert-body strong{color:var(--danger);}
  .alert-ready .alert-body strong{color:var(--purple);}
  .alert-items{font-size:12.5px;color:var(--text-secondary);overflow-wrap:anywhere;}
  /* A real tap target, not faint text — the old version (font-size:13px,
     2px/4px padding, no background) was genuinely hard to hit on a phone,
     the exact "hard to close like a popup ad" complaint. 30px circular hit
     area (WCAG/HIG both want ~44px for a primary action; this is a
     secondary dismiss on an already-transient banner, so a bit smaller is
     fine) with a visible background so it reads as a button at a glance,
     not just stray text in the corner. */
  .alert-dismiss{background:rgba(255,255,255,.07);border:none;color:var(--text-secondary);
    font-size:15px;line-height:1;cursor:pointer;margin-left:auto;flex:none;
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,color .15s ease;}
  .alert-dismiss:hover{background:rgba(255,255,255,.14);color:var(--text-primary);}
  .alert-dismiss:active{background:rgba(255,255,255,.2);}

  @media (max-width:640px){ .alert-stack{left:14px;right:14px;width:auto;top:76px;} }

  .print-btn{background:none;border:1px dashed var(--border);color:var(--text-secondary);
    font-size:12px;font-weight:700;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;
    align-self:flex-start;}
  .print-btn:hover{color:var(--text-primary);border-color:var(--text-muted);}
  .print-ticket{display:none;}

  /* ---------------------------------------------------------------
     Kitchen ticket printing. Each order-card carries its own hidden
     .print-ticket (rendered server-side in _order_feed.html from that
     order's real data). printOrder() below marks exactly one card
     .printing-ticket before calling window.print() — this stylesheet
     hides the entire normal UI and reveals only that one ticket, on
     plain white/black, sized for a standard A4 printer.
     --------------------------------------------------------------- */
  @media print{
    body *{visibility:hidden;}
    .order-card.printing-ticket .print-ticket,
    .order-card.printing-ticket .print-ticket *{visibility:visible;}
    .no-print{display:none!important;}
    .print-ticket{
      display:block;position:absolute;top:0;left:0;width:100%;
      font-family:'Courier New',monospace;color:#000;background:#fff;
      padding:28px;font-size:15px;line-height:1.8;
    }
    .pt-header{display:flex;justify-content:space-between;font-size:20px;font-weight:700;
      border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:10px;}
    .pt-time{font-size:13px;margin-bottom:10px;}
    .pt-divider{margin:10px 0;border-top:1px dashed #000;}
    .pt-item-line{font-weight:700;margin-top:10px;}
    .pt-mod{padding-left:20px;font-size:13px;}
    .pt-note{font-weight:700;margin-top:10px;}
    @page{margin:14mm;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>
    </span>
    <div>
      <span class="brand-eyebrow">BiteBox Worker · {{ .DepartmentLabel }}</span>
      <h1 class="worker-name">{{ .Username }}</h1>
    </div>
  </div>
  <div class="topbar-right">
    <span class="live-pill"><span class="pulse-dot"></span>Live</span>
    {{ if .ShowOrders }}
    <button type="button" class="sound-toggle" id="phoneAlertToggle" aria-pressed="false" title="Checking phone alert support…">📵</button>
    <button type="button" class="sound-toggle" id="alertSoundToggle" aria-pressed="true" title="Sound alerts on — click to mute">🔔</button>
    {{ end }}
    <form method="POST" action="/logout"><button class="btn-ghost" type="submit">Log out</button></form>
  </div>
</header>

<div class="alert-stack" id="alert-stack" aria-live="polite"></div>

<main class="dashboard">

  {{ if .ShowOrders }}
  <div hx-ext="ws" ws-connect="/worker/assistance/ws">
    <div id="assistance-alerts"></div>
  </div>

  <div class="section-heading">
    <div class="section-title">
      <span class="section-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>
      <h2>Live order feed</h2>
    </div>
    <span class="count-badge" id="orderCount">0 active</span>
  </div>

  <div hx-ext="ws" ws-connect="/worker/orders/ws">
    <div class="order-grid" id="order-feed">
      <p class="empty-note">Loading orders...</p>
    </div>
  </div>
  {{ end }}

  {{ if .ShowDJ }}
  {{ if .ShowOrders }}<div style="height:28px;"></div>{{ end }}
  <div class="section-heading">
    <div class="section-title">
      <span class="section-icon" style="background:var(--purple-soft);color:var(--purple);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      <h2>DJ request terminal</h2>
    </div>
  </div>

  <div hx-ext="ws" ws-connect="/worker/dj/ws">
    <div class="order-grid" id="dj-feed">
      <p class="empty-note">Loading requests...</p>
    </div>
  </div>
  {{ end }}

</main>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button class="toast-undo" id="toastUndo">Undo</button>
</div>

<script>
  // ---------------------------------------------------------------
  // Urgency color: a continuous gradient, not discrete steps —
  // green (fresh) -> amber -> red -> purple (needs attention now).
  // Purely client-side, driven by each card's real data-ordered-at
  // (server-rendered from the order's actual created_at). Nothing here
  // is fetched — it's cosmetic, the backend doesn't need to know.
  // ---------------------------------------------------------------
  const URGENCY_STOPS = [
    { min: 0,  rgb: [95, 167, 119] },  // green  — var(--success)
    { min: 10, rgb: [217, 164, 65] },  // amber  — var(--accent)
    { min: 20, rgb: [194, 91, 72]  },  // red    — var(--danger)
    { min: 30, rgb: [155, 111, 174] }, // purple — var(--purple)
  ];
  function urgencyRGB(minutes){
    if (minutes <= URGENCY_STOPS[0].min) return URGENCY_STOPS[0].rgb;
    const last = URGENCY_STOPS[URGENCY_STOPS.length - 1];
    if (minutes >= last.min) return last.rgb;
    for (let i = 0; i < URGENCY_STOPS.length - 1; i++) {
      const a = URGENCY_STOPS[i], b = URGENCY_STOPS[i + 1];
      if (minutes >= a.min && minutes <= b.min) {
        const t = (minutes - a.min) / (b.min - a.min);
        return [0, 1, 2].map(k => Math.round(a.rgb[k] + (b.rgb[k] - a.rgb[k]) * t));
      }
    }
    return last.rgb;
  }
  const rgbCss = (rgb, a = 1) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;

  function refreshOrderCard(card){
    const orderedAt = parseInt(card.dataset.orderedAt, 10);
    if (!orderedAt) return;
    const minutes = Math.max(0, Math.floor((Date.now() - orderedAt) / 60000));
    const rgb = urgencyRGB(minutes);

    card.style.borderLeftColor = rgbCss(rgb, 1);
    const badge = card.querySelector('.timer-badge');
    if (badge) {
      badge.textContent = minutes + ' min';
      badge.style.background = rgbCss(rgb, 0.16);
      badge.style.color = rgbCss(rgb, 1);
    }

    // NEW tag is only useful for the first few minutes — drop it after 5
    const newFlag = card.querySelector('.new-flag');
    if (newFlag && minutes >= 5) newFlag.remove();
  }

  function resortOldestFirst(){
    const grid = document.getElementById('order-feed');
    if (!grid) return;
    Array.from(grid.querySelectorAll('.order-card'))
      .sort((a, b) => parseInt(a.dataset.orderedAt, 10) - parseInt(b.dataset.orderedAt, 10))
      .forEach(card => grid.appendChild(card));
  }

  function updateOrderCount(){
    const badge = document.getElementById('orderCount');
    if (!badge) return;
    const grid = document.getElementById('order-feed');
    badge.textContent = (grid ? grid.querySelectorAll('.order-card').length : 0) + ' active';
  }

  function tickOrders(){
    document.querySelectorAll('#order-feed .order-card').forEach(refreshOrderCard);
    resortOldestFirst();
    updateOrderCount();
  }
  tickOrders();                          // paint real elapsed time immediately on load
  setInterval(tickOrders, 60 * 1000);    // then keep it live, every minute, client-side only

  // The order feed's content is replaced wholesale on every live update
  // (this worker's own action, or a checkout/status change from anyone
  // else) — htmx fires oobAfterSwap for the websocket's OOB push and
  // afterSwap for this worker's own direct hx-post response; re-run the
  // (idempotent) client-side enhancements after either.
  function onOrderFeedUpdate(){ tickOrders(); checkForNewOrderAlerts(); }
  document.body.addEventListener('htmx:afterSwap', onOrderFeedUpdate);
  document.body.addEventListener('htmx:oobAfterSwap', onOrderFeedUpdate);

  // ---------------------------------------------------------------
  // Order alerts — a banner + chime for "new order in" and "ready for
  // pickup", so kitchen/bar/waiter notice without staring at the screen.
  // Driven off each card's real data-order-id/data-status (see
  // _order_feed.html), diffed against what we saw last render:
  //   - an id we've never seen before: brand-new card. "ready" means the
  //     waiter feed (which only ever holds ready orders) just got one;
  //     anything else means kitchen/bar/superworker just got a fresh order.
  //   - an id we already know, flipping from not-ready to ready: the
  //     superworker feed shows every status in one place, so an existing
  //     order can turn "ready" without a new card ever appearing.
  // The very first render (page load) only primes this map — nobody
  // needs a banner per order that was already sitting there.
  // ---------------------------------------------------------------
  const orderAlertState = new Map(); // orderId -> was it "ready" last time we saw it
  let orderAlertsPrimed = false;

  // Set by initPhoneAlerts below (both on load and on every subscribe/
  // unsubscribe) — read by notifyOrder to skip the in-page banner+chime
  // entirely once this device already gets the real thing. Real push and
  // this in-page fallback exist for the same reason (notice an order
  // without staring at the screen); once a device has the real one, the
  // in-page copy is just a second, redundant alert for the exact same
  // event — this is what keeps it to a fallback for a device that's never
  // enabled push at all (a mounted kitchen screen with no "phone" of its
  // own to push to), not something layered on top for every device.
  let phoneAlertsSubscribed = false;

  function summarizeOrderItems(card){
    return Array.from(card.querySelectorAll('.order-items .order-item')).map(item => {
      const clone = item.cloneNode(true);
      clone.querySelectorAll('.po-excl').forEach(el => el.remove());
      const qty = clone.querySelector('.qty');
      const qtyText = qty ? qty.textContent.trim() : '';
      if (qty) qty.remove();
      return [qtyText, clone.textContent.trim()].filter(Boolean).join(' ');
    }).join(', ');
  }

  function checkForNewOrderAlerts(){
    const grid = document.getElementById('order-feed');
    if (!grid) return;
    const seenIds = new Set();
    grid.querySelectorAll('.order-card').forEach(card => {
      const id = card.dataset.orderId;
      const isReady = card.dataset.status === 'ready';
      seenIds.add(id);
      const wasReady = orderAlertState.get(id);
      if (orderAlertsPrimed) {
        if (wasReady === undefined) notifyOrder(isReady ? 'ready' : 'new', card);
        else if (!wasReady && isReady) notifyOrder('ready', card);
      }
      orderAlertState.set(id, isReady);
    });
    // Drop ids that fell out of the feed (served, cancelled, handed off) —
    // if that same id ever came back it'd be a different order in practice.
    Array.from(orderAlertState.keys()).forEach(id => { if (!seenIds.has(id)) orderAlertState.delete(id); });
    orderAlertsPrimed = true;
  }

  // --- sound: synthesized in-browser, no audio asset to ship/license ---
  const ALERT_SOUND_KEY = 'biteboxAlertSoundEnabled';
  let audioCtx = null;
  let alertSoundEnabled = localStorage.getItem(ALERT_SOUND_KEY) !== 'off'; // on by default

  function ensureAudioContext(){
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  // Browsers refuse to play audio before any user gesture on the page — an
  // alert fired by a websocket push has no gesture of its own, so the first
  // tap/click anywhere primes the context in advance.
  document.addEventListener('click', () => ensureAudioContext(), { once: true });

  function playTone(ctx, freq, startTime, duration, gainPeak = 0.18){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  function playAlertChime(kind){
    if (!alertSoundEnabled) return;
    const ctx = ensureAudioContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    if (kind === 'ready') {
      playTone(ctx, 660, now, 0.16);        // rising two-note chime: "it's done"
      playTone(ctx, 990, now + 0.16, 0.22);
    } else {
      playTone(ctx, 760, now, 0.18);        // single beep: "new ticket in"
    }
  }

  function setAlertSoundEnabled(on){
    alertSoundEnabled = on;
    localStorage.setItem(ALERT_SOUND_KEY, on ? 'on' : 'off');
    const btn = document.getElementById('alertSoundToggle');
    if (!btn) return;
    btn.textContent = on ? '🔔' : '🔕';
    btn.classList.toggle('muted', !on);
    btn.setAttribute('aria-pressed', String(on));
    btn.title = on ? 'Sound alerts on — click to mute' : 'Sound alerts muted — click to unmute';
  }
  const alertSoundToggle = document.getElementById('alertSoundToggle');
  if (alertSoundToggle) {
    setAlertSoundEnabled(alertSoundEnabled);
    alertSoundToggle.addEventListener('click', () => {
      ensureAudioContext();
      setAlertSoundEnabled(!alertSoundEnabled);
      if (alertSoundEnabled) playAlertChime('new'); // audible confirmation it's back on
    });
  }

  // ---------------------------------------------------------------
  // Real phone notifications — a lock-screen-visible alert via Web Push,
  // the same mechanism a chat app's push uses, not just this page's own
  // in-page banner. Requires a browser that supports it (Chrome/Edge on
  // Android and desktop work directly; iOS Safari only after the page has
  // been added to the Home Screen and opened from there — iOS won't
  // subscribe from a plain browser tab, permission or not).
  // ---------------------------------------------------------------
  (function initPhoneAlerts(){
    const btn = document.getElementById('phoneAlertToggle');
    if (!btn) return; // DJ-only dashboard has no order feed, nothing to alert on

    const VAPID_PUBLIC_KEY = "{{ .VAPIDPublicKey }}";
    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
    const isStandalone = navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

    // Disable the button with a real, specific reason instead of just
    // hiding it — silently vanishing when unsupported looks identical to
    // "broken," and gives whoever's looking at the phone no way to tell
    // "this browser/connection can't do it" from an actual bug.
    function disableWithReason(reason){
      btn.disabled = true;
      btn.classList.add('muted');
      btn.title = reason;
    }

    // Push is a secure-context-only browser API — it's refused outright
    // over plain HTTP to anything but localhost, no server-side workaround
    // exists. This is the single most likely reason a phone on the venue's
    // own WiFi (hitting the server's LAN IP over http://) sees this
    // disabled: it needs the server behind real HTTPS (or a tunnel like
    // ngrok for testing) before a phone — as opposed to a desktop browser
    // on localhost — can subscribe at all.
    if (!window.isSecureContext) {
      disableWithReason('Phone alerts need this site loaded over HTTPS (localhost is exempt for testing) — plain HTTP is blocked by the browser itself, not by this app.');
      return;
    }
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      disableWithReason('This browser doesn’t support phone push notifications.');
      return;
    }
    if (!VAPID_PUBLIC_KEY) {
      disableWithReason('Phone alerts aren’t set up on this server yet (missing VAPID key) — ask whoever runs the server to check it started cleanly.');
      return;
    }
    if (isIOS && !isStandalone) {
      disableWithReason('On iPhone: tap Share → "Add to Home Screen", then open BiteBox from there — Safari only allows push for an installed home-screen app, not a regular tab.');
      return;
    }

    function urlBase64ToUint8Array(base64String){
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const out = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; i++) out[i] = rawData.charCodeAt(i);
      return out;
    }

    function setPhoneButtonState(subscribed){
      phoneAlertsSubscribed = subscribed;
      btn.textContent = subscribed ? '📱' : '📵';
      btn.setAttribute('aria-pressed', String(subscribed));
      btn.title = subscribed ? 'Phone alerts on — click to turn off' : 'Get order alerts on this phone, even locked';
      btn.classList.toggle('muted', !subscribed);
    }

    let swRegistration = null;
    navigator.serviceWorker.register('/sw.js')
      .then(reg => { swRegistration = reg; return reg.pushManager.getSubscription(); })
      .then(sub => setPhoneButtonState(!!sub))
      .catch(() => disableWithReason('Could not set up phone alerts in this browser (service worker registration failed).'));

    async function subscribe(){
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        showToast('Notifications are blocked — allow them for this site in your browser settings to use phone alerts');
        return;
      }
      try {
        const reg = swRegistration || await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
        await fetch('/worker/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub.toJSON()),
        });
        setPhoneButtonState(true);
        showToast('Phone alerts enabled on this device');
      } catch (e) {
        showToast('Could not enable phone alerts on this device');
      }
    }

    async function unsubscribe(){
      try {
        const reg = swRegistration || await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (sub) {
          await fetch('/worker/push/unsubscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ endpoint: sub.endpoint }),
          });
          await sub.unsubscribe();
        }
        setPhoneButtonState(false);
        showToast('Phone alerts turned off on this device');
      } catch (e) {
        showToast('Could not turn off phone alerts on this device');
      }
    }

    btn.addEventListener('click', () => {
      if (btn.getAttribute('aria-pressed') === 'true') unsubscribe();
      else subscribe();
    });
  })();

  // --- tab-title flash: catches a worker who's looked away from the tab ---
  const baseTitle = document.title;
  let titleFlashTimer = null;
  function flashTitle(kind){
    if (!document.hidden) return;
    const label = kind === 'ready' ? '✅ Ready for pickup' : '🔔 New order';
    let showingAlert = false;
    clearInterval(titleFlashTimer);
    titleFlashTimer = setInterval(() => {
      document.title = showingAlert ? baseTitle : label;
      showingAlert = !showingAlert;
    }, 1000);
    document.addEventListener('visibilitychange', function stop(){
      if (!document.hidden) {
        clearInterval(titleFlashTimer);
        document.title = baseTitle;
        document.removeEventListener('visibilitychange', stop);
      }
    });
  }

  function dismissAlertBanner(banner){
    banner.classList.remove('show');
    setTimeout(() => banner.remove(), 250);
  }

  function notifyOrder(kind, card){
    // A device with real phone alerts on already gets this exact event as
    // a lock-screen push — see phoneAlertsSubscribed's own comment. Skip
    // the in-page banner/chime/title-flash entirely rather than layer a
    // second alert for the same order on top of it.
    if (phoneAlertsSubscribed) return;

    const table = card.querySelector('.table-tag')?.textContent.trim() || 'Table —';
    const items = summarizeOrderItems(card);
    playAlertChime(kind);
    flashTitle(kind);

    const stack = document.getElementById('alert-stack');
    if (!stack) return;
    const banner = document.createElement('div');
    banner.className = 'alert-banner ' + (kind === 'ready' ? 'alert-ready' : 'alert-new');

    const icon = document.createElement('span');
    icon.className = 'alert-icon';
    icon.textContent = kind === 'ready' ? '✅' : '🔔';

    const body = document.createElement('div');
    body.className = 'alert-body';
    const heading = document.createElement('strong');
    // table/items come from product & ingredient names (admin-entered, not
    // guest-authored) via textContent, but built as real text nodes here
    // rather than innerHTML anyway — cheap insurance against a stray "<".
    heading.textContent = (kind === 'ready' ? 'Ready for pickup' : 'New order') + ' — ' + table;
    const itemsLine = document.createElement('span');
    itemsLine.className = 'alert-items';
    itemsLine.textContent = items || 'No items';
    body.append(heading, itemsLine);

    const dismissBtn = document.createElement('button');
    dismissBtn.className = 'alert-dismiss';
    dismissBtn.type = 'button';
    dismissBtn.setAttribute('aria-label', 'Dismiss');
    dismissBtn.textContent = '✕';
    dismissBtn.addEventListener('click', () => dismissAlertBanner(banner));

    banner.append(icon, body, dismissBtn);
    stack.prepend(banner);
    requestAnimationFrame(() => banner.classList.add('show'));
    setTimeout(() => dismissAlertBanner(banner), 9000);
  }

  checkForNewOrderAlerts(); // prime the map with whatever's already on screen at load

  // ---------------------------------------------------------------
  // Toast + undo. The undo button always performs a real request (the
  // same status-update endpoint, reused with the previous value) — a
  // purely-visual revert would leave this screen disagreeing with every
  // other connected client's live view, since the actual state already
  // changed on the server the moment the original click's request
  // succeeded.
  // ---------------------------------------------------------------
  let toastTimer = null;
  function showToast(msg, undoFn){
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    const undoBtn = document.getElementById('toastUndo');
    undoBtn.hidden = !undoFn; // plain status messages (e.g. phone-alert setup) have nothing to undo
    toast.classList.add('show');
    clearTimeout(toastTimer);
    undoBtn.onclick = () => { undoFn && undoFn(); toast.classList.remove('show'); };
    toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
  }

  document.body.addEventListener('click', (e) => {
    const actionBtn = e.target.closest('.btn-primary-action[data-undo-status]');
    if (actionBtn) {
      const card = actionBtn.closest('.order-card');
      const orderId = card.dataset.orderId;
      const undoStatus = actionBtn.dataset.undoStatus;
      const table = card.querySelector('.table-tag').textContent;
      const label = actionBtn.dataset.next === 'preparing' ? 'moved to Preparing' : 'marked served';
      actionBtn.addEventListener('htmx:afterRequest', function handler(evt) {
        actionBtn.removeEventListener('htmx:afterRequest', handler);
        if (!evt.detail.successful) return;
        showToast(table + ' ' + label, () => {
          htmx.ajax('POST', '/worker/orders/' + orderId + '/status', { values: { status: undoStatus }, target: '#order-feed', swap: 'innerHTML' });
        });
      }, { once: true });
      return;
    }

    const payBtn = e.target.closest('.mark-paid-btn');
    if (payBtn) {
      const card = payBtn.closest('.order-card');
      const orderId = card.dataset.orderId;
      const table = card.querySelector('.table-tag').textContent;
      payBtn.addEventListener('htmx:afterRequest', function handler(evt) {
        payBtn.removeEventListener('htmx:afterRequest', handler);
        if (!evt.detail.successful) return;
        showToast(table + ' marked as paid', () => {
          htmx.ajax('POST', '/worker/orders/' + orderId + '/unpaid', { target: '#order-feed', swap: 'innerHTML' });
        });
      }, { once: true });
    }
  });

  // ---------------------------------------------------------------
  // Print for kitchen: pure client-side browser print, per order. The
  // ticket markup already exists (hidden) inside the target order-card,
  // rendered server-side from that order's real data — we just mark that
  // one card so the @media print stylesheet reveals only its ticket, then
  // hand off to the browser's native print dialog. WSL/the server are not
  // involved beyond having served this page; the OS + already-configured
  // A4 printer do the rest, same as printing any webpage.
  // ---------------------------------------------------------------
  function printOrder(orderId){
    const card = document.querySelector('.order-card[data-order-id="' + orderId + '"]');
    if (!card) return;
    card.classList.add('printing-ticket');
    window.print();
  }
  // Clean the marker card up again once the print dialog closes (works for
  // both "printed" and "cancelled" — afterprint fires either way), so a
  // second print of a different order doesn't also show a stale first one.
  window.addEventListener('afterprint', () => {
    document.querySelectorAll('.order-card.printing-ticket')
      .forEach(c => c.classList.remove('printing-ticket'));
  });

  // kicked out live: the server closes any of our websockets with close
  // code 4001 the moment our own account gets deactivated (checked every
  // few seconds server-side), so we don't sit on a stale page.
  document.body.addEventListener('htmx:wsClose', (e) => {
    if (e.detail && e.detail.event && e.detail.event.code === 4001) {
      window.location.href = '/login';
    }
  });
</script>

</body>
</html>
