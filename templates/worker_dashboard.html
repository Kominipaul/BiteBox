<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteBox - Worker Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/ws.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .flex-between {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="flex-between">
    <h2>👷 Worker Dashboard</h2>
    <form method="POST" action="/logout"><button style="border-radius: 8px;">Log Out</button></form>
  </div>

  <hr>

  <h3>📋 Live Order Feed</h3>
  <div hx-ext="ws" ws-connect="/worker/orders/ws">
    <div id="order-feed">
      <p>Loading orders...</p>
    </div>
  </div>

  <hr>

  <h3>🎵 DJ Request Terminal</h3>
  <div hx-ext="ws" ws-connect="/worker/dj/ws">
    <div id="dj-feed">
      <p>Loading requests...</p>
    </div>
  </div>

</body>
</html>
