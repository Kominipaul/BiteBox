<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table #{{ .TableNumber }} — Ouzeri Marina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/ws.js"></script>
<style>
  :root{
    --bg-base:#14100D; --bg-surface:#1D1712; --bg-raised:#261F18;
    --border:#332920; --border-soft:#2A2119;
    --text-primary:#F5EFE6; --text-secondary:#AB9C89; --text-muted:#75695C;
    --accent:#D9A441; --accent-strong:#E8B85B; --accent-soft:rgba(217,164,65,.13);
    --success:#5FA777; --success-soft:rgba(95,167,119,.14);
    --danger:#C25B48; --danger-soft:rgba(194,91,72,.15);
    --info:#6B8CAE; --info-soft:rgba(107,140,174,.15);
    --neutral:#8C8375; --neutral-soft:rgba(140,131,117,.14);
    --radius-lg:16px; --radius-md:12px; --radius-sm:9px;
    --font-display:'IBM Plex Mono',ui-monospace,monospace;
    --font-body:'Manrope',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-base);color:var(--text-primary);
    font-family:var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh;}
  button,input,textarea{font-family:inherit;}
  h1,h2,h3{margin:0;}
  :focus-visible{outline:3px solid var(--accent-strong);outline-offset:2px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--border-soft);
    position:sticky;top:0;background:rgba(20,16,13,.92);backdrop-filter:blur(8px);z-index:20;}
  .table-id{display:flex;align-items:center;gap:10px;}
  .table-id h1{font-size:19px;font-weight:800;}
  .host-tag{background:var(--info-soft);color:var(--info);font-size:11px;font-weight:800;
    padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;}
  .leave-btn{background:transparent;color:var(--danger);border:1.5px solid rgba(194,91,72,.4);
    font-weight:700;font-size:13px;padding:9px 15px;border-radius:var(--radius-sm);cursor:pointer;}
  .leave-btn:hover{background:var(--danger-soft);}

  .page{max-width:720px;margin:0 auto;padding:20px 18px 140px;}

  .venue-banner{text-align:center;margin-bottom:22px;}
  .venue-banner .name{font-size:22px;font-weight:800;letter-spacing:-.01em;}
  .venue-banner .tagline{font-size:13px;color:var(--text-muted);margin-top:2px;}

  .cat-tabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;}
  .cat-tab{flex:none;background:var(--bg-surface);border:1px solid var(--border);color:var(--text-secondary);
    font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:99px;cursor:pointer;}
  .cat-tab.active{background:var(--accent);color:#221805;border-color:var(--accent);}

  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:30px;}
  .item-card{background:var(--bg-surface);border:1px solid var(--border-soft);border-radius:var(--radius-md);
    padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;grid-column:span 1;}
  .item-card.expanded{grid-column:1 / -1;}
  .item-name{font-weight:700;font-size:14.5px;line-height:1.3;}
  .item-price{font-family:var(--font-display);font-size:13.5px;color:var(--accent-strong);font-weight:600;}
  .item-add{margin-top:auto;display:flex;gap:8px;align-items:center;}
  .add-btn{flex:1;background:var(--accent-soft);color:var(--accent-strong);border:1px solid rgba(217,164,65,.3);
    font-weight:800;font-size:14px;padding:9px;border-radius:var(--radius-sm);cursor:pointer;}
  .add-btn:hover{background:rgba(217,164,65,.22);}
  .customize-link{background:none;border:none;color:var(--text-muted);font-size:12px;font-weight:700;
    text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:6px 2px;white-space:nowrap;}
  .customize-link:hover{color:var(--text-secondary);}

  .customize-panel{display:none;border-top:1px solid var(--border-soft);padding-top:12px;margin-top:2px;}
  .customize-panel.open{display:block;}
  .customize-hint{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
  .ing-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
  /* Removable ingredients start green ("included by default"); tapping
     excludes them (muted/struck-through). Extra ingredients start blue
     ("available, not included"); tapping adds them, turning green to match
     the same "this is on your order" language — tapping again reverts to
     blue. Green always means "on your order," consistently for both kinds. */
  .ing-chip{background:var(--success-soft);color:var(--success);border:1px solid rgba(95,167,119,.3);
    font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:99px;cursor:pointer;}
  .ing-chip.excluded{background:var(--bg-raised);color:var(--text-muted);border-color:var(--border);
    text-decoration:line-through;}
  .ing-chip.ing-chip-extra{background:var(--info-soft);color:var(--info);border-color:rgba(107,140,174,.3);}
  .ing-chip.ing-chip-extra.included{background:var(--success-soft);color:var(--success);border-color:rgba(95,167,119,.3);}
  .add-custom-btn{width:100%;background:var(--accent);color:#221805;border:none;font-weight:800;
    font-size:13.5px;padding:10px;border-radius:var(--radius-sm);cursor:pointer;}
  .add-custom-btn:hover{filter:brightness(1.08);}

  .order-line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
  .order-line:last-child{border-bottom:none;}
  .order-line-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .order-line-name{font-weight:700;font-size:14px;}
  .order-line-price{font-size:12px;color:var(--text-muted);}
  .order-line-excl{font-size:11.5px;color:var(--accent-strong);}
  .ol-controls{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);
    overflow:hidden;background:var(--bg-raised);flex:none;}
  .ol-btn{background:none;border:none;color:var(--text-secondary);width:28px;height:30px;
    font-weight:800;font-size:15px;cursor:pointer;}
  .ol-btn:hover{color:var(--text-primary);}
  .ol-qty{font-family:var(--font-display);font-size:13px;font-weight:700;min-width:22px;text-align:center;display:inline-block;}
  .order-line-total{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--accent-strong);
    width:58px;text-align:right;flex:none;}
  .order-subtotal-row{display:none;justify-content:space-between;align-items:center;
    padding-top:12px;margin-top:4px;border-top:1px solid var(--border);font-weight:800;font-size:15px;}
  .order-subtotal{font-family:var(--font-display);color:var(--accent-strong);}
  .cancel-order-btn{display:none;width:100%;margin-top:14px;background:transparent;color:var(--danger);
    border:1.5px solid rgba(194,91,72,.4);font-weight:700;font-size:13.5px;padding:11px;
    border-radius:var(--radius-md);cursor:pointer;}
  .cancel-order-btn:hover{background:var(--danger-soft);}

  .custom-tip-wrap{display:none;margin-bottom:6px;}
  .custom-tip-wrap.show{display:block;}

  .section{background:var(--bg-surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
    padding:20px;margin-bottom:20px;}
  .section h2{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:9px;}
  .section h2 .icon{color:var(--accent);}

  .empty-note{color:var(--text-muted);font-size:13.5px;padding:6px 0;}

  .field-label{font-size:12.5px;font-weight:700;color:var(--text-secondary);margin:14px 0 6px;display:block;}
  .field-label:first-of-type{margin-top:0;}
  .field-input{width:100%;background:var(--bg-raised);border:1px solid var(--border);color:var(--text-primary);
    border-radius:var(--radius-sm);padding:12px;font-size:14.5px;}
  .field-input::placeholder{color:var(--text-muted);}
  textarea.field-input{resize:vertical;min-height:56px;line-height:1.4;}

  .pay-method-row{display:flex;gap:8px;}
  .pay-method-chip{flex:1;background:var(--bg-raised);border:1.5px solid var(--border);color:var(--text-secondary);
    font-weight:700;font-size:13.5px;padding:11px 8px;border-radius:var(--radius-sm);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;}
  .pay-method-chip.active{background:var(--accent-soft);color:var(--accent-strong);border-color:rgba(217,164,65,.45);}
  .demo-tag{font-size:9.5px;font-weight:800;background:var(--neutral-soft);color:var(--neutral);
    padding:2px 6px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em;}

  .tip-row{display:flex;gap:8px;margin-bottom:6px;}
  .tip-chip{flex:1;background:var(--bg-raised);border:1px solid var(--border);color:var(--text-secondary);
    font-weight:700;font-size:13.5px;padding:9px;border-radius:var(--radius-sm);cursor:pointer;}
  .tip-chip.active{background:var(--accent-soft);color:var(--accent-strong);border-color:rgba(217,164,65,.4);}
  .dj-submit{width:100%;background:var(--accent);color:#221805;font-weight:800;font-size:14.5px;
    padding:13px;border-radius:var(--radius-md);border:none;cursor:pointer;margin-top:14px;}
  .dj-submit:hover{filter:brightness(1.08);}

  .placed-order{border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;}
  .placed-order:last-child{margin-bottom:0;}
  .placed-order.canceled{opacity:.5;}
  .po-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .po-status{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px;
    background:var(--accent-soft);color:var(--accent-strong);text-transform:uppercase;letter-spacing:.03em;}
  .po-status.canceled{background:var(--neutral-soft);color:var(--neutral);}
  .po-time{font-size:11.5px;color:var(--text-muted);}
  .po-item{font-size:13.5px;font-weight:600;padding:2px 0;}
  .po-excl{font-size:11.5px;color:var(--text-muted);font-weight:500;}
  .po-note{font-size:12.5px;color:var(--text-secondary);font-style:italic;margin-top:8px;}
  .po-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;
    padding-top:10px;border-top:1px solid var(--border-soft);}
  .po-method{font-size:12.5px;color:var(--text-muted);font-weight:600;}
  .po-total{font-family:var(--font-display);font-weight:700;color:var(--accent-strong);}
  .po-cancel{width:100%;margin-top:12px;background:transparent;color:var(--danger);
    border:1.5px solid rgba(194,91,72,.4);font-weight:700;font-size:13px;padding:9px;
    border-radius:var(--radius-sm);cursor:pointer;}
  .po-cancel:hover{background:var(--danger-soft);}

  .cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg-surface);
    border-top:1px solid var(--border);padding:14px 18px;display:none;
    align-items:center;justify-content:space-between;gap:14px;z-index:30;
    box-shadow:0 -10px 30px rgba(0,0,0,.35);}
  .cart-bar.show{display:flex;}
  .cart-bar-info{display:flex;flex-direction:column;}
  .cart-bar-count{font-size:12px;color:var(--text-muted);font-weight:600;}
  .cart-bar-total{font-family:var(--font-display);font-size:19px;font-weight:700;}
  .checkout-btn{background:var(--accent);color:#221805;font-weight:800;font-size:15px;
    padding:13px 22px;border-radius:var(--radius-md);border:none;cursor:pointer;white-space:nowrap;}
  .checkout-btn:hover{filter:brightness(1.08);}
</style>
</head>
<body>

<header class="topbar">
  <div class="table-id">
    <h1>Table #{{ .TableNumber }}</h1>
    <span class="host-tag">Host</span>
  </div>
  <button class="leave-btn" hx-post="/table/{{ .TableNumber }}/leave" hx-confirm="Leave Table #{{ .TableNumber }}? Anyone can claim this table after you leave.">Leave table</button>
</header>

<main class="page">

  <div class="venue-banner">
    <div class="name">Ouzeri Marina</div>
    <div class="tagline">Browse the menu below — tap to add to your order</div>
  </div>

  <div class="cat-tabs">
    <button type="button" class="cat-tab active" data-cat="all">All</button>
    <button type="button" class="cat-tab" data-cat="Drinks">Drinks</button>
    <button type="button" class="cat-tab" data-cat="Food">Food</button>
    <button type="button" class="cat-tab" data-cat="Other">Other</button>
  </div>

  <div hx-ext="ws" ws-connect="/menu/ws">
    <div class="menu-grid" id="product-list">
      <p class="empty-note">Loading menu...</p>
    </div>
  </div>

  <section class="section" id="orderSection">
    <h2><span class="icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12L6 3H3"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
    </span>Your order</h2>
    <div id="cart-summary" hx-get="/cart/summary" hx-trigger="load" hx-swap="innerHTML">
      <p class="empty-note">Loading cart...</p>
    </div>
  </section>
  <div id="cart-refresh-trigger" style="display:none;"></div>

  <div hx-ext="ws" ws-connect="/table/{{ .TableNumber }}/ws">
    <section class="section" id="placedOrdersSection">
      <h2><span class="icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      </span>Your orders</h2>
      <div id="placed-orders">
        <p class="empty-note">Loading your orders...</p>
      </div>
    </section>

    <div id="song-status"></div>
  </div>

  <!-- populated live over /menu/ws (see templates/_dj_section.html) — a
       venue with the DJ feature switched off never receives this fragment,
       so the whole "Request a song" form is genuinely absent, not just
       hidden. #song-status above stays outside this div and always present:
       it's targeted by the separate /table/{number}/ws connection and must
       keep showing the outcome of a request a guest already sent even if
       the admin disables new requests afterward. -->
  <div id="dj-section"></div>

</main>

<div id="cart-bar" class="cart-bar"></div>

<script>
  // ---- category tabs (client-only filter; re-applied after every live
  // menu update since #product-list gets wholesale-replaced by the
  // websocket, not incrementally patched) ----
  function applyCategoryFilter(){
    const active = document.querySelector('.cat-tab.active');
    const cat = active ? active.dataset.cat : 'all';
    document.querySelectorAll('#product-list .item-card').forEach(card => {
      card.style.display = (cat === 'all' || card.dataset.cat === cat) ? '' : 'none';
    });
  }
  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      applyCategoryFilter();
    });
  });
  document.body.addEventListener('htmx:afterSwap', applyCategoryFilter);
  document.body.addEventListener('htmx:oobAfterSwap', applyCategoryFilter);

  // ---- menu grid: quick add, customize toggle, ingredient chip toggle,
  // add-to-order-with-customization (a real /cart/add request, built as a
  // throwaway form so repeated "excluded"/"extras" fields serialize
  // correctly) ----
  function submitCartAction(url, productId, excluded, extras){
    const form = document.createElement('form');
    const pid = document.createElement('input');
    pid.type = 'hidden'; pid.name = 'product_id'; pid.value = productId;
    form.appendChild(pid);
    (excluded || []).forEach(name => {
      const inp = document.createElement('input');
      inp.type = 'hidden'; inp.name = 'excluded'; inp.value = name;
      form.appendChild(inp);
    });
    (extras || []).forEach(name => {
      const inp = document.createElement('input');
      inp.type = 'hidden'; inp.name = 'extras'; inp.value = name;
      form.appendChild(inp);
    });
    document.body.appendChild(form);
    htmx.ajax('POST', url, { source: form, target: '#cart-summary', swap: 'innerHTML' })
      .then(() => form.remove());
  }

  // Delegated from document.body, not bound to #product-list directly: the
  // menu websocket's very first push OOB-replaces that whole div (outerHTML,
  // a new DOM node), which would silently orphan a listener attached
  // straight to it — this is why "Customize" previously did nothing.
  document.body.addEventListener('click', (e) => {
    const card = e.target.closest('#product-list .item-card');
    if (!card) return;

    if (e.target.closest('.customize-link')) {
      const panel = card.querySelector('.customize-panel');
      panel.classList.toggle('open');
      card.classList.toggle('expanded', panel.classList.contains('open'));
      return;
    }
    if (e.target.closest('.ing-chip')) {
      // Removable ingredients start "on" (green) — tapping excludes them.
      // Extra ingredients start "off" (blue) — tapping includes them
      // (green, same "on your order" color as an included removable one).
      // Same green = "on your order" language either way.
      const chip = e.target.closest('.ing-chip');
      if (chip.dataset.kind === 'extra') {
        chip.classList.toggle('included');
      } else {
        chip.classList.toggle('excluded');
      }
      return;
    }
    if (e.target.closest('.add-custom-btn')) {
      const btn = e.target.closest('.add-custom-btn');
      const excluded = Array.from(card.querySelectorAll('.ing-chip[data-kind="removable"].excluded')).map(c => c.dataset.ing);
      const extras = Array.from(card.querySelectorAll('.ing-chip[data-kind="extra"].included')).map(c => c.dataset.ing);
      submitCartAction('/cart/add', btn.dataset.productId, excluded, extras);
      card.querySelectorAll('.ing-chip').forEach(c => { c.classList.remove('excluded'); c.classList.remove('included'); });
      card.querySelector('.customize-panel').classList.remove('open');
      card.classList.remove('expanded');
    }
  });

  // ---- "Your order" line stepper: +/- re-targets the exact customization
  // variant via its data-excluded/data-extras snapshot, not just the
  // product. Delegated from document.body (not #cart-summary directly) —
  // it isn't currently OOB-replaced, only innerHTML-swapped, so this would
  // work either way, but delegating consistently everywhere means a future
  // change to how it's updated can't silently orphan this listener the way
  // #product-list was above. ----
  document.body.addEventListener('click', (e) => {
    const btn = e.target.closest('#cart-summary .ol-btn');
    if (!btn) return;
    const line = btn.closest('.order-line');
    const productId = line.dataset.productId;
    let excluded = [], extras = [];
    try { excluded = JSON.parse(line.dataset.excluded || '[]'); } catch (err) {}
    try { extras = JSON.parse(line.dataset.extras || '[]'); } catch (err) {}
    const url = btn.dataset.action === 'inc' ? '/cart/add' : '/cart/remove';
    submitCartAction(url, productId, excluded, extras);
  });

  // ---- payment method chips ----
  document.body.addEventListener('click', (e) => {
    const chip = e.target.closest('#cart-summary .pay-method-chip');
    if (!chip) return;
    document.querySelectorAll('.pay-method-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    document.getElementById('paymentMethodInput').value = chip.dataset.method;
    const checkoutBtn = document.getElementById('checkoutBtn');
    if (checkoutBtn) {
      checkoutBtn.textContent = chip.dataset.method === 'cash' ? 'Place order · Pay cash' : 'Place order · Pay by card';
    }
  });

  // ---- DJ tip presets + custom amount ----
  const customTipWrap = document.getElementById('customTipWrap');
  const customTipInput = document.getElementById('customTipInput');
  const tipAmountInput = document.getElementById('tipAmountInput');
  function updateDjSubmitLabel(){
    const amount = parseFloat(tipAmountInput.value) || 0;
    document.getElementById('djSubmit').textContent = `Send request & pay €${amount.toFixed(2)}`;
  }
  document.querySelectorAll('.tip-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.tip-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      if (chip.dataset.tip === 'custom') {
        customTipWrap.classList.add('show');
        const val = parseFloat(customTipInput.value);
        tipAmountInput.value = val > 0 ? val : 0;
        customTipInput.focus();
      } else {
        customTipWrap.classList.remove('show');
        tipAmountInput.value = chip.dataset.tip;
      }
      updateDjSubmitLabel();
    });
  });
  customTipInput.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    tipAmountInput.value = val > 0 ? val : 0;
    updateDjSubmitLabel();
  });
</script>

</body>
</html>
