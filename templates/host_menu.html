<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteBox - Table #{{ .TableNumber }} Host</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/ws.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .flex-between {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .leave-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    @media (max-width: 480px) {
      .leave-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="flex-between">
    <h2>🍔 Table #{{ .TableNumber }} (Host)</h2>
    <button 
      class="leave-btn" 
      hx-post="/table/{{ .TableNumber }}/leave" 
      hx-confirm="Are you sure you want to release Table #{{ .TableNumber }}?">
      🚪 Leave Table
    </button>
  </div>

  <hr>

  <h3>Menu</h3>
  <div hx-ext="ws" ws-connect="/menu/ws">
    <div id="product-list">
      <p>Loading menu...</p>
    </div>
  </div>

  <hr>

  <h3>🛒 Your Order</h3>
  <div id="cart-summary" class="card" hx-get="/cart/summary" hx-trigger="load" hx-swap="innerHTML">
    <p>Loading cart...</p>
  </div>
  <div id="cart-refresh-trigger" style="display:none;"></div>

  <div hx-ext="ws" ws-connect="/table/{{ .TableNumber }}/ws">
    <div id="order-status"></div>

    <hr>

    <h3>🎵 Request a Song to DJ</h3>
    <form hx-post="/dj/request" hx-target="#dj-form-result">
      <label>Song Title & Artist</label>
      <input type="text" name="song" placeholder="e.g. Starlight - Muse" required>

      <label>Tip Amount (€)</label>
      <input type="number" name="tip" value="2.00" step="0.50" min="1.00" required>

      <button type="submit" style="border-radius: 8px; width: 100%;">Send Request & Pay</button>
    </form>
    <div id="dj-form-result"></div>
    <div id="song-status"></div>
  </div>

</body>
</html>
