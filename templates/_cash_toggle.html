{{ if .AllowCashOrders }}
<span class="status-pill status-available">Enabled</span>
<p class="empty-note" style="margin:10px 0 14px;">Guests can choose cash or card at checkout.</p>
<button type="button" class="btn btn-ghost btn-sm" hx-post="/admin/settings/cash-orders/toggle" hx-target="#cashTogglePanel" hx-swap="innerHTML">Disable cash orders</button>
{{ else }}
<span class="status-pill status-hidden">Disabled</span>
<p class="empty-note" style="margin:10px 0 14px;">Guests only see card at checkout. The cash option is hidden.</p>
<button type="button" class="btn btn-primary btn-sm" hx-post="/admin/settings/cash-orders/toggle" hx-target="#cashTogglePanel" hx-swap="innerHTML">Enable cash orders</button>
{{ end }}
<span id="paymentNavStatus" class="settings-nav-status {{ if .AllowCashOrders }}is-on{{ else }}is-off{{ end }}" hx-swap-oob="true"></span>
