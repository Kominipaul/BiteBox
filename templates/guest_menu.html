<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <link rel="stylesheet" href="/static/site.css?v={{ .V }}">
  <link rel="stylesheet" href="/brand.css">
  <link rel="icon" href="/brand/icon.png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/manifest-site.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{ .VenueName }}">
</head>
<body class="msg">
  <div class="card">
    {{ if .TableNumber }}<span class="eyebrow">Table #{{ .TableNumber }}</span>{{ end }}
    <h2>{{ .Title }}</h2>
    {{ range $i, $l := .Lines }}<p{{ if $i }} class="muted"{{ end }}>{{ $l }}</p>{{ end }}
    <p><a href="/">{{ .VenueName }} home</a></p>
  </div>
</body>
</html>
