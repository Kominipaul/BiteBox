<form class="add-form add-form-business" hx-post="/admin/settings/business-details" hx-target="#businessSettingsPanel" hx-swap="innerHTML">
  <input class="field-input" name="business_vat_number" value="{{ .BusinessVATNumber }}" maxlength="100" placeholder="ΑΦΜ (VAT number)" aria-label="VAT number">
  <input class="field-input" name="tax_office" value="{{ .TaxOffice }}" maxlength="100" placeholder="Δ.Ο.Υ. (Tax office)" aria-label="Tax office">
  <button type="submit" class="btn btn-primary">Save</button>
</form>
<p class="empty-note" style="margin-top:10px;">Shown on the demo receipt printout (see an order's "🧾 Receipt" link in Order history) — <strong>not a real tax registration</strong>, and never transmitted anywhere. Structure only.</p>
